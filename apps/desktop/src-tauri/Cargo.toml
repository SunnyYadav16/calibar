[package]
name = "calibar-app"
description = "calibar desktop app. The only crate allowed to depend on Tauri (I11)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "calibar_app_lib"

[lints]
workspace = true

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test builds only: embeds a WebDriver server for the macOS end-to-end tests.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
