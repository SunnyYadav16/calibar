[project]
name = "calibar-eval"
version = "0.1.0"
description = "Eval harness CLI for calibar: dataset validation, metrics, threshold tuning and reports."
requires-python = ">=3.14"
dependencies = ["typer>=0.15"]

[project.scripts]
calibar-eval = "calibar_eval.cli:app"

[dependency-groups]
dev = ["scikit-learn", "hypothesis"]
lint = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
test = ["pytest"]

[tool.uv]
default-groups = ["dev", "test", "lint"]

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
