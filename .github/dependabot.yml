version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /tools/eval
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
